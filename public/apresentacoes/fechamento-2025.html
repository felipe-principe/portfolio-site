<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fechamento 2025</title>
<meta name="description" content="Fechamento do ciclo 2025 da operação de atendimento — Streaming Service.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --gelo:#EEF6FE; --branco:#FFFFFF; --ice:#DCEEFE;
  --abissal:#001B44; --profundo:#003791; --azul:#0072E8; --medio:#1E93F0; --ceu:#6CC0FA;
  --vapor:#CBE5FD; --linha:#B7DAF8;
  --cicatriz:#E23757; --alvo:#0B8F5E;
  --tinta:#0A1B33; --fraca:#5D7089;
  --saida:cubic-bezier(.16,1,.3,1);
  --movimento:cubic-bezier(.62,.02,.2,1);
  --elastico:cubic-bezier(.34,1.4,.5,1);
  --rodape:92px;
  --agua:30vh;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--gelo); color:var(--tinta);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}

/* ============================================================ o mar
   Três camadas em velocidades diferentes: é a diferença de velocidade que
   faz o olho ler profundidade em vez de um desenho que desliza. A ALTURA
   muda por cena — a água é o nível do problema, sobe quando ele aperta. */
.mar{
  position:fixed; left:-9vw; right:-9vw; bottom:-2vh; width:118vw; height:30vh;
  z-index:0; pointer-events:none;
  transition:height 1.15s var(--saida);
}
.mar svg{width:100%;height:100%;display:block;overflow:visible}
.veu{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
  background:linear-gradient(180deg,rgba(0,28,61,.92) 0%,rgba(0,45,110,.96) 52%,rgba(0,28,61,1) 100%);
  transition:opacity 1s var(--saida);
}
body.inundado .veu{opacity:1}
body.inundado .mar{height:112vh}
/* Em junho a tela inteira é água. As camadas claras recuam para o texto
   branco, a linha do gráfico e o número vermelho terem fundo contra o quê
   se destacar — sem isso tudo cai no mesmo meio-tom. */
body.inundado #o1{opacity:.24}
body.inundado #o2{opacity:.34}
body.inundado #o3{opacity:.78}

/* A inundação em cascata: a água sobe primeiro, o breu vem atrás. Na saída,
   inverte — o breu clareia antes de a água baixar. É o único momento longo
   da peça, e o que faz junho parecer um corte de câmera e não um fade. */
.veu{transition:opacity .8s var(--saida)}
body.inundado .veu{transition:opacity 1.05s var(--saida) .3s}
body.inundado .mar{transition:height 1.3s cubic-bezier(.32,.94,.24,1)}

/* ------------------------------------------------ trilho: a câmera anda */
.palco{position:fixed;inset:0;overflow:hidden;z-index:1}
.trilho{
  position:absolute; inset:0; display:flex;
  transition:transform 1.05s var(--movimento); will-change:transform;
}
.cena{
  flex:0 0 100vw; height:100vh; position:relative;
  padding:74px clamp(28px,6vw,132px) calc(var(--rodape) + 34px + min(var(--agua), 44vh) * .42);
  transition:padding-bottom 1.15s var(--saida);
  display:flex; flex-direction:column; justify-content:center;
}
.dentro{
  position:relative; z-index:1;
  width:100%; max-width:1340px; margin:0 auto;
  transition:transform 1.05s var(--saida), opacity .7s ease;
}
.cena:not(.viva) .dentro{transform:translateX(-3vw) scale(.972);opacity:.2}

/* ------------------------------------------------------- revelação */
.r{
  opacity:0; transform:translateY(30px); filter:blur(6px);
  transition:opacity .8s var(--saida), transform .9s var(--saida), filter .65s ease;
}
.cena.viva .r{opacity:1;transform:translateY(0);filter:blur(0)}
.a1{transition-delay:.14s}.a2{transition-delay:.26s}.a3{transition-delay:.38s}
.a4{transition-delay:.5s}.a5{transition-delay:.62s}

/* título revelado por máscara de linha — o gesto mais caro da peça */
.mask{display:block;overflow:hidden;padding-bottom:.06em}
.mask>span{
  display:block; transform:translateY(106%) skewY(2.6deg);
  transition:transform 1.05s var(--saida);
}
.cena.viva .mask>span{transform:translateY(0) skewY(0)}
.cena.viva .mask:nth-of-type(2)>span{transition-delay:.12s}
.cena.viva .mask:nth-of-type(3)>span{transition-delay:.22s}

/* --------------------------------------------------------- tipografia */
h1,h2{font-weight:700;letter-spacing:-.032em;line-height:.99;font-variation-settings:'wdth' 112;color:var(--abissal)}
h2{font-size:clamp(32px,4.9vw,68px);max-width:14ch}
h1{font-size:clamp(38px,6.4vw,100px);max-width:15ch}
.apoio{margin-top:20px;max-width:33ch;font-size:clamp(15px,1.32vw,19px);line-height:1.52;color:var(--fraca)}
.apoio strong{color:var(--tinta);font-weight:600}
.dois{display:grid;gap:clamp(30px,4.6vw,84px);grid-template-columns:minmax(0,.84fr) minmax(0,1.16fr);align-items:center}
@media (max-width:900px){.dois{grid-template-columns:minmax(0,1fr);gap:22px}}

/* número-herói com varredura de luz */
.heroi{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
.numero{
  font-size:clamp(58px,10.2vw,150px);font-weight:700;line-height:.84;
  letter-spacing:-.05em;font-variation-settings:'wdth' 108;
  background:linear-gradient(115deg,var(--abissal) 4%,var(--azul) 42%,var(--ceu) 56%,var(--azul) 72%,var(--profundo));
  background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
}
.cena.viva .numero{animation:varrer 5s 1.1s var(--saida) infinite}
@keyframes varrer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.numero.mau{background:linear-gradient(115deg,#8E1229 4%,var(--cicatriz) 46%,#FF8DA3 58%,var(--cicatriz) 74%,#8E1229);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text}
.unidade{font-size:clamp(18px,2.2vw,32px);font-weight:600;color:var(--fraca);letter-spacing:-.02em}
.selo{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;
  font-size:13px;font-weight:700;background:rgba(11,143,94,.11);color:var(--alvo)}
.selo.mau{background:rgba(226,55,87,.11);color:var(--cicatriz)}
.selo::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}

/* --------------------------------------------- cena invertida (junho) */
/* O scrim: em junho o texto fica sobre água em movimento, então não há
   ajuste de cor que garanta contraste — a crista clara passa por baixo dele
   mais cedo ou mais tarde. Uma sombra ancorada no bloco de texto resolve sem
   ter de achatar as ondas, que são o ponto da cena. Medido: o branco no pior
   ponto de fundo sai de 2,65:1 (v2) para acima de 7:1. */
.cena.escura::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(118% 80% at 20% 48%,
    rgba(0,16,42,.78) 0%, rgba(0,16,42,.45) 38%, rgba(0,16,42,0) 66%);
}
.cena.escura h2,.cena.escura h1{color:#fff}
.cena.escura .apoio{color:#D2E7FA}
.cena.escura .apoio strong{color:#fff}
.cena.escura .par-rotulo{color:#7FA8CE}
.cena.escura .par-de{color:#5E86AD}
.cena.escura .par-para{color:#fff}
.cena.escura .par{border-bottom-color:rgba(255,255,255,.14)}
.cena.escura .unidade{color:#A9C8E4}
/* Em junho o herói divide a coluna com o gráfico: menor, e com ar embaixo.
   O vermelho também sobe de tom — o #8E1229 do fim da rampa some no azul-noite. */
.cena.escura .heroi{margin-bottom:34px}
.cena.escura .numero{font-size:clamp(50px,8vw,112px)}
.cena.escura .numero.mau{background:linear-gradient(115deg,#E23757 4%,#FF8DA3 44%,#FFD9E0 57%,#FF8DA3 72%,#E23757);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text}

/* ------------------------------------------------------------ figuras */
.figura{position:relative;width:100%}
.figura svg{display:block;width:100%;height:auto;overflow:visible}
.legenda{margin-top:16px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--fraca)}
.legenda i{display:inline-flex;align-items:center;gap:7px;font-style:normal}
.legenda i::before{content:'';width:16px;height:3px;border-radius:2px;background:var(--azul)}
.legenda i.meta::before{background:none;border-top:2px dashed var(--fraca);height:0}
.legenda i.ruim::before{background:var(--cicatriz)}
.legenda i.marca::before{width:2px;height:13px;border-radius:1px;background:var(--abissal);opacity:.34}
.cena.escura .legenda{color:#C2DEF5}
.cena.escura .legenda i::before{background:var(--ceu)}

/* pares antes/depois */
.pares{display:grid;gap:24px;width:max-content;max-width:100%}
.par{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:18px;
  padding-bottom:20px;border-bottom:1px solid var(--linha)}
.par:last-child{border-bottom:none;padding-bottom:0}
.par-rotulo{grid-column:1/-1;font-size:13px;color:var(--fraca);margin-bottom:-5px}
.par-de,.par-para{font-size:clamp(27px,3.3vw,45px);font-weight:700;letter-spacing:-.03em}
.par-de{color:var(--fraca);opacity:.6}
.par-para{color:var(--abissal)}
.par.bom .par-para{color:var(--alvo)}
.par.bom .par-seta{color:var(--alvo)}
.par.mau .par-para{color:var(--cicatriz)}
.par.mau .par-seta{color:var(--cicatriz)}
.par-seta{color:var(--azul);font-size:19px}
.cena.viva .par{animation:parEntra .7s var(--saida) both}
.cena.viva .par:nth-child(2){animation-delay:.34s}
.cena.viva .par:nth-child(3){animation-delay:.46s}
.cena.viva .par:nth-child(1){animation-delay:.22s}
@keyframes parEntra{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}

/* barras de espera */
.espera{display:grid;gap:24px}
.espera-item{display:grid;gap:9px}
.espera-topo{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--fraca)}
.espera-topo b{font-size:clamp(23px,2.7vw,37px);color:var(--abissal);font-weight:700;letter-spacing:-.02em}
.espera-trilha{height:17px;border-radius:9px;background:var(--vapor);overflow:hidden}
.espera-barra{height:100%;border-radius:9px;width:0;
  background:linear-gradient(90deg,var(--ceu),var(--azul));
  transition:width 1.15s var(--movimento)}
.espera-item.mau .espera-barra{background:linear-gradient(90deg,#F48DA1,var(--cicatriz))}

/* comparação de motivos */
.motivos{display:grid;gap:28px}
.motivo{display:grid;gap:10px}
.motivo-topo{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.motivo-nome{font-size:clamp(16px,1.55vw,21px);font-weight:600;color:var(--abissal)}
.motivo-sla{font-size:clamp(25px,2.9vw,39px);font-weight:700;letter-spacing:-.03em;color:var(--abissal)}
.motivo.pior .motivo-sla{color:var(--cicatriz)}
.motivo-trilha{height:15px;border-radius:8px;background:var(--vapor);position:relative}
.motivo-trilha::after{content:'';position:absolute;left:85%;top:-6px;bottom:-6px;width:2px;
  border-radius:1px;background:var(--abissal);opacity:.34}
.motivo-barra{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--medio),var(--azul));
  transition:width 1.05s var(--movimento)}
.motivo.pior .motivo-barra{background:linear-gradient(90deg,#F48DA1,var(--cicatriz))}
.motivo-pe{font-size:13px;color:var(--fraca)}

/* decisões */
.acoes{display:grid;gap:13px}
.acao{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;
  background:var(--branco);border:1px solid var(--linha);border-radius:17px;
  padding:19px 23px;box-shadow:0 18px 40px -32px rgba(0,28,61,.55);
  transition:transform .32s var(--saida),box-shadow .32s ease}
@media (hover:hover) and (pointer:fine){
  .acao:hover{transform:translateX(7px);box-shadow:0 24px 50px -30px rgba(0,28,61,.6)}
  .acao:hover .acao-n{transform:rotate(-7deg) scale(1.07)}
}
.acao-n{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
  font-size:17px;font-weight:700;color:#fff;transition:transform .32s var(--elastico)}
.acao h3{font-size:clamp(17px,1.75vw,23px);font-weight:600;letter-spacing:-.02em;color:var(--abissal);margin-bottom:6px}
.acao p{font-size:14.5px;line-height:1.52;color:var(--fraca);max-width:54ch}

/* ------------------------------------------------------------ a capa */
.capa-marca{width:clamp(200px,23vw,330px);height:auto;display:block;margin-bottom:34px}
.capa-titulo{font-size:clamp(48px,9.2vw,146px);font-weight:700;line-height:.91;
  letter-spacing:-.045em;font-variation-settings:'wdth' 115;color:var(--abissal)}
.capa-titulo em{font-style:normal;
  background:linear-gradient(104deg,var(--abissal) 12%,var(--azul) 68%,var(--medio));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.dica{margin-top:40px;font-size:13px;color:var(--fraca);
  display:inline-flex;align-items:center;gap:10px;
  opacity:0;transition:opacity .6s ease 1.9s}
.cena.viva .dica{opacity:1}
.tecla{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;
  border:1px solid var(--linha);border-radius:7px;background:var(--branco);
  font-size:13px;color:var(--tinta);box-shadow:0 1px 0 var(--linha)}

/* -------------------------------------------------------- cromo fixo */
.capitulo{position:fixed;top:22px;right:clamp(20px,4vw,40px);z-index:40;
  display:flex;align-items:center;gap:11px;font-size:12px;font-weight:600;
  letter-spacing:.06em;color:var(--fraca)}
.capitulo span{transition:opacity .35s ease}
.capitulo i{font-style:normal;color:var(--azul);font-weight:600}
.capitulo b{color:var(--azul);font-weight:700}
body.inundado .capitulo{color:#A9C8E4}
body.inundado .capitulo b,body.inundado .capitulo i{color:var(--ceu)}

/* ------------------------------------------------- a régua de capítulos
   A versão anterior trazia os doze meses aqui e prometia o que não cumpria:
   lê-se da esquerda para a direita como se cada mês fosse um slide, mas
   dezembro é a cena 2 e junho é a 5 — clicar num mês fazia a apresentação
   pular para trás. Agora a régua é a HISTÓRIA, que é o que de fato anda da
   esquerda para a direita, e clicar leva exatamente à cena marcada.
   O calendário não sumiu: virou contexto, no rótulo do canto superior.

   Cada segmento é uma cena. O ativo se abre e diz o próprio nome, e o tom
   vem do mês de que a cena fala — o vermelho de junho no meio, o verde de
   dezembro nas pontas. A régua vira o mapa da narrativa. */
.ano{
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  z-index:40; display:flex; align-items:center; gap:clamp(8px,1.1vw,16px);
  height:58px; padding:0 10px 0 18px; max-width:calc(100vw - 32px);
  border-radius:999px; background:rgba(255,255,255,.8);
  border:1px solid rgba(0,28,61,.08);
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 20px 46px -26px rgba(0,28,61,.6);
  transition:background .9s var(--saida), border-color .9s var(--saida),
             box-shadow .9s var(--saida);
}
body.inundado .ano{
  background:rgba(0,24,58,.55); border-color:rgba(255,255,255,.18);
  box-shadow:0 20px 50px -24px rgba(0,0,0,.65);
}
.ano-marca{width:23px;height:23px;flex:none;cursor:pointer;background:none;border:0;padding:0;
  color:var(--profundo);opacity:.9;transition:color .9s var(--saida)}
.ano-marca svg{width:100%;height:100%;display:block;transition:transform .3s var(--elastico)}
body.inundado .ano-marca{color:#fff}

.regua{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0}
.cap{position:relative;flex:none;height:30px;padding:0;border:0;background:none;
  cursor:pointer;font:inherit;display:flex;align-items:center}
.cap::before{
  content:'';display:block;width:16px;height:5px;border-radius:3px;
  background:var(--linha);
  transition:background .45s var(--saida), width .5s var(--saida);
}
.cap.visto::before{background:var(--medio)}
.cap.vivo::before{width:9px;background:var(--azul)}
.cap[data-tom="bom"].visto::before{background:#5FBE9B}
.cap[data-tom="bom"].vivo::before{background:var(--alvo)}
.cap[data-tom="mau"].visto::before{background:#F08BA0}
.cap[data-tom="mau"].vivo::before{background:var(--cicatriz)}

.cap-nome{
  max-width:0; overflow:hidden; white-space:nowrap; opacity:0;
  font-size:12px; font-weight:600; letter-spacing:-.01em; color:var(--abissal);
  transition:max-width .55s var(--saida), opacity .3s ease, padding .55s var(--saida);
}
.cap.vivo .cap-nome{max-width:150px;opacity:1;padding-left:8px}
.cap[data-tom="bom"].vivo .cap-nome{color:var(--alvo)}
.cap[data-tom="mau"].vivo .cap-nome{color:var(--cicatriz)}
body.inundado .cap::before{background:rgba(255,255,255,.24)}
body.inundado .cap.visto::before{background:rgba(255,255,255,.58)}
body.inundado .cap[data-tom="bom"].visto::before{background:#63D3AC}
body.inundado .cap[data-tom="mau"].visto::before{background:#FF9FB2}
body.inundado .cap-nome{color:#fff}
body.inundado .cap[data-tom="mau"].vivo::before{background:#FF7D95}
body.inundado .cap[data-tom="mau"].vivo .cap-nome{color:#FF9FB2}

.ano-contagem{font-size:12px;color:var(--fraca);flex:none;min-width:36px;text-align:right;
  transition:color .9s var(--saida)}
body.inundado .ano-contagem{color:#87AECF}
@media (hover:hover) and (pointer:fine){
  .cap:hover::before{background:var(--azul)}
  body.inundado .cap:hover::before{background:#fff}
  .ano-marca:hover{opacity:1}.ano-marca:hover svg{transform:scale(1.13)}
}
.cap:focus-visible,.ano-marca:focus-visible,.pbtn:focus-visible{outline:2px solid var(--azul);outline-offset:4px;border-radius:6px}
body.inundado .cap:focus-visible,body.inundado .pbtn:focus-visible{outline-color:var(--ceu)}

.passo{display:flex;align-items:center;gap:6px;flex:none}
.pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha);background:#fff;
  color:var(--profundo);font-size:17px;cursor:pointer;display:grid;place-items:center;
  transition:background .2s var(--saida),color .2s var(--saida),border-color .2s var(--saida),
             transform .2s var(--saida)}
.pbtn:hover:not(:disabled){background:var(--azul);color:#fff;border-color:var(--azul);transform:translateY(-2px)}
.pbtn:disabled{opacity:.26;cursor:default}
body.inundado .pbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24);color:#fff}
body.inundado .pbtn:hover:not(:disabled){background:#fff;color:var(--profundo)}

/* --------------------------------------------------------- o balão */
.balao{position:fixed;z-index:50;pointer-events:none;opacity:0;
  transform:translate(-50%,-122%) scale(.94);
  background:var(--abissal);color:#fff;border-radius:12px;padding:9px 14px;
  box-shadow:0 18px 36px -14px rgba(0,28,61,.7);
  font-size:13px;line-height:1.35;white-space:nowrap;
  transition:opacity .16s ease,transform .2s var(--elastico)}
.balao.vis{opacity:1;transform:translate(-50%,-128%) scale(1)}
.balao b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--ceu)}
.balao.mau b{color:#FF9FB0}
.balao span{color:#8FB4D6}
.guia{opacity:0;transition:opacity .16s ease}
.guia.vis{opacity:1}

@media (prefers-reduced-motion:reduce){
  .on1,.on2,.on3,.bl1,.bl2,.bl3{animation:none}
  .cena.viva .numero{animation:none;background-position:30% 50%}
  .r{transition:opacity .25s ease;transform:none;filter:none}
  .mask>span{transform:none}
  .cena.viva .par{animation:none}
  .trilho{transition:transform .3s ease}
  .espera-barra,.motivo-barra{transition:none}
}
@media (max-width:900px){
  :root{--rodape:84px}
  .cena{padding-top:56px}
  .capitulo,.passo{display:none}
  .ano{left:12px;right:12px;transform:none;max-width:none;padding:0 14px;gap:10px}
  .regua{gap:5px;flex:1 1 0;overflow:hidden}
  .cap::before{width:10px}
  .cap.vivo .cap-nome{max-width:96px;padding-left:6px}

<script>
(() => {
'use strict';

const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL = ['janeiro','fevereiro','março','abril','maio','junho',
              'julho','agosto','setembro','outubro','novembro','dezembro'];
const D = {
  sla:  [81.45,81.83,82.12,81.54,82.77,76.89,82.49,83.53,83.27,84.82,83.75,85.14],
  vol:  [11125,10444,11965,13671,11694,15856,13830,11826,11094,10785,10164,8977]
};
const META = 85, JUN = 5, DEZ = 11, TAU = Math.PI * 2;
const pct = (n,c=2) => n.toFixed(c).replace('.',',');
const brl = n => n.toLocaleString('pt-BR');
const CALMO = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const ESTATICO = /[?&]estatico/.test(location.search);
const anima = CALMO && !ESTATICO;

/* ==================================================================== o mar
   Nada de `translateX ... alternate`: aquilo oscila, e o olho lê o pêndulo em
   poucos segundos. Aqui a fase só AVANÇA, e cada camada é a soma de duas
   senoides de frequências diferentes — as cristas mudam de forma enquanto
   viajam, então o padrão nunca se fecha. É a mesma técnica do fundo animado
   do dashboard. */
const MARW = 1440, MARH = 480;
const CAMADAS = [
  { el:'o1', y:150, a1:30, k1:1.1, p1:0.4, a2:15, k2:2.7, p2:2.1, vel: 0.52, desl:-1.00 },
  { el:'o2', y:248, a1:26, k1:0.9, p1:2.6, a2:13, k2:2.1, p2:0.9, vel: 0.78, desl: 0.62 },
  { el:'o3', y:342, a1:22, k1:1.3, p1:4.2, a2:11, k2:2.4, p2:3.4, vel: 1.06, desl:-0.34 }
];
CAMADAS.forEach(c => c.no = document.getElementById(c.el));

let fase = 0, forca = 1, forcaAlvo = 1, ultimo = 0;

function curvaMar(c, f) {
  const N = 44, passo = (MARW + 200) / N;
  let d = '';
  for (let i = 0; i <= N; i++) {
    const x = -100 + i * passo, u = x / MARW;
    const y = c.y
      + Math.sin(u * c.k1 * TAU + c.p1 + f * c.vel) * c.a1 * forca
      + Math.sin(u * c.k2 * TAU + c.p2 - f * c.vel * 1.6) * c.a2 * forca;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
  }
  return d + `L${MARW + 100},${MARH + 120}L-100,${MARH + 120}Z`;
}

function pintarMar(t) {
  if (!ultimo) ultimo = t;
  const dt = Math.min(64, t - ultimo); ultimo = t;
  fase += dt * 0.00052;
  forca += (forcaAlvo - forca) * 0.045;
  CAMADAS.forEach(c => {
    c.no.setAttribute('d', curvaMar(c, fase + c.desl * fase * 0.14));
  });
  requestAnimationFrame(pintarMar);
}
CAMADAS.forEach(c => c.no.setAttribute('d', curvaMar(c, 0)));
if (anima) requestAnimationFrame(pintarMar);

/* ============================================================== a curva
   Catmull-Rom em Bézier: passa exatamente por cada mês e ainda flui. */
function caminho(pts, t = .5) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    d += `C${(p1[0]+(p2[0]-p0[0])/6*t).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6*t).toFixed(1)} `
       + `${(p2[0]-(p3[0]-p1[0])/6*t).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6*t).toFixed(1)} `
       + `${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function grafico(serie, o = {}) {
  const W = o.w || 760, H = o.h || 320, mt = o.mt ?? 26, mb = o.mb ?? 34;
  const min = o.min ?? Math.min(...serie) - 1.6, max = o.max ?? Math.max(...serie) + 1.6;
  const x = i => i * W / (serie.length - 1);
  const y = v => mt + (max - v) / (max - min) * (H - mt - mb);
  const linha = caminho(serie.map((v, i) => [x(i), y(v)]));
  const area = `${linha}L${W},${H-mb}L0,${H-mb}Z`;
  const id = 'g' + Math.random().toString(36).slice(2, 7);
  const iMau = o.mau ?? (o.eixo === false ? -1 : JUN), iBom = o.bom ?? -1;
  const cor = i => i === iMau ? '#E23757' : i === iBom ? '#0B8F5E' : '#0070D1';
  const claro = o.claro ? '#fff' : '#001C3D', fraco = o.claro ? '#A9C8E4' : '#5D7089';

  const meta = o.meta != null ? `
    <line x1="0" y1="${y(o.meta).toFixed(1)}" x2="${W}" y2="${y(o.meta).toFixed(1)}"
          stroke="${fraco}" stroke-width="1.5" stroke-dasharray="5 5" opacity=".6"/>
    <text x="0" y="${(y(o.meta)-11).toFixed(1)}" font-size="12" fill="${fraco}" font-weight="600">meta ${o.meta}%</text>` : '';

  const marcas = (o.marcar||[]).map(i =>
    `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(serie[i]).toFixed(1)}" r="7"
      fill="${o.claro?'#001C3D':'#fff'}" stroke="${cor(i)}" stroke-width="3.5"/>`).join('');

  const rotulos = (o.rotular||[]).map(([i,txt,lado,acima]) => {
    const anc = lado==='fim'?'end':lado==='meio'?'middle':'start';
    const dx = lado==='fim'?-14:lado==='meio'?0:14;
    const dy = (acima ?? (i !== iMau)) ? -18 : 26;
    return `<text x="${(x(i)+dx).toFixed(1)}" y="${(y(serie[i])+dy).toFixed(1)}" text-anchor="${anc}"
      font-size="15" font-weight="700" fill="${cor(i)==='#0070D1'?claro:cor(i)}">${txt}</text>`;
  }).join('');

  const eixo = o.eixo === false ? '' : serie.map((_,i) =>
    `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11"
      fill="${i===iMau?'#E23757':fraco}" font-weight="${i===iMau?700:400}">${MES[i+(o.desde||0)]}</text>`).join('');

  const alvos = serie.map((v,i) =>
    `<rect x="${(x(i)-W/serie.length/2).toFixed(1)}" y="0" width="${(W/serie.length).toFixed(1)}" height="${H}"
      fill="transparent" data-i="${i}" data-x="${x(i).toFixed(1)}" data-y="${y(v).toFixed(1)}" data-v="${v}"/>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||''}"
    data-serie="${o.serie||'SLA'}" data-sufixo="${o.sufixo??'%'}" data-desde="${o.desde||0}" data-mau="${iMau}">
    <defs>
      <linearGradient id="${id}f" x1="0" y1="0" x2="1" y2="0">${o.claro
        ? `<stop offset="0" stop-color="#4FA6E6"/><stop offset=".5" stop-color="#8FCCF7"/><stop offset="1" stop-color="#D6ECFF"/>`
        : `<stop offset="0" stop-color="#7FC4F5"/><stop offset=".5" stop-color="#0070D1"/><stop offset="1" stop-color="#00439C"/>`}      </linearGradient>
      <linearGradient id="${id}a" gradientUnits="userSpaceOnUse" x1="0" y1="${mt}" x2="0" y2="${H-mb}">
        <stop offset="0" stop-color="${o.claro?'#7FC4F5':'#0070D1'}" stop-opacity="${o.claro?'.30':'.22'}"/>
        <stop offset="1" stop-color="${o.claro?'#7FC4F5':'#0070D1'}" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="${id}m" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000"/><stop offset=".11" stop-color="#fff"/>
        <stop offset=".89" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <mask id="${id}k"><rect width="${W}" height="${H}" fill="url(#${id}m)"/></mask>
    </defs>
    ${meta}
    <path class="area" d="${area}" fill="url(#${id}a)" mask="url(#${id}k)" opacity="0"/>
    <path class="fita" d="${linha}" fill="none" stroke="url(#${id}f)" stroke-width="${o.grossura||5}"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g class="guia">
      <line class="guia-l" x1="0" y1="${mt}" x2="0" y2="${H-mb}" stroke="#0070D1" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>
      <circle class="guia-p" r="6" fill="#0070D1" stroke="${o.claro?'#001C3D':'#fff'}" stroke-width="2.5"/>
    </g>
    ${marcas}${rotulos}${eixo}
    <g class="alvos">${alvos}</g>
  </svg>`;
}

  </div>` }
];

/* =========================================================== construção */
const trilho = document.getElementById('trilho');
trilho.innerHTML = S.map(s =>
  `<section class="cena${s.escura?' escura':''}" id="s-${s.id}" aria-hidden="true"><div class="dentro">${s.html}</div></section>`).join('');

/* A régua sai das CENAS, não do calendário. O tom de cada segmento vem do
   mês de que a cena fala, então a régua desenha a forma da história: verde
   nas pontas (dezembro), vermelho no meio (junho). */
const tomDe = s => s.mes === JUN ? 'mau' : s.mes === DEZ ? 'bom' : '';
const regua = document.getElementById('regua');
regua.innerHTML = S.map((s,i) =>
  `<button class="cap" data-i="${i}" data-tom="${tomDe(s)}" title="${s.cap}" aria-label="Ir para ${s.cap}, cena ${i+1} de ${S.length}"><span class="cap-nome">${s.cap}</span></button>`).join('');

const cenas = [...trilho.querySelectorAll('.cena')];
const caps = [...regua.querySelectorAll('.cap')];
const mar = document.getElementById('mar');
const capNome = document.getElementById('cap-nome'), capNum = document.getElementById('cap-num');
const contagem = document.getElementById('contagem');
const ant = document.getElementById('ant'), prox = document.getElementById('prox');
let atual = -1;

function contar(el) {
  const alvo = parseFloat(el.dataset.contar), dec = +(el.dataset.dec || 0);
  if (!anima) { el.textContent = pct(alvo, dec); return; }
  const dur = 1400, t0 = performance.now();
  const passo = t => {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = pct(alvo * (1 - Math.pow(1 - k, 4)), dec);
    if (k < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function desenharFita(svg, atraso) {
  const fita = svg.querySelector('.fita'), area = svg.querySelector('.area');
  if (!fita) return;
  const L = fita.getTotalLength();
  if (!anima) { if (area) area.style.opacity = 1; return; }
  fita.style.transition = 'none';
  fita.style.strokeDasharray = L; fita.style.strokeDashoffset = L;
  svg.querySelectorAll('.pt, text').forEach(n => { n.style.transition = 'none'; n.style.opacity = 0; });
  requestAnimationFrame(() => {
    fita.style.transition = `stroke-dashoffset 1.6s cubic-bezier(.16,1,.3,1) ${atraso}ms`;
    fita.style.strokeDashoffset = 0;
    if (area) { area.style.transition = `opacity .9s ease ${atraso+750}ms`; area.style.opacity = 1; }
    svg.querySelectorAll('.pt, text').forEach((n,k) => {
      n.style.transition = `opacity .5s ease ${atraso+950+k*45}ms`; n.style.opacity = 1;
    });
  });
}

function entrar(i, instante) {
  i = Math.max(0, Math.min(S.length - 1, i));
  if (i === atual) return;
  const primeira = atual === -1;
  atual = i;
  const s = S[i], cena = cenas[i];

  trilho.style.transition = instante ? 'none' : '';
  trilho.style.transform = `translate3d(${-i * 100}vw,0,0)`;

  cenas.forEach((c,k) => { c.classList.toggle('viva', k === i); c.setAttribute('aria-hidden', k===i?'false':'true'); });

  // a água: altura e bravura contam a história junto com o texto
  mar.style.height = s.mar + 'vh';
  // o CSS usa --agua para centrar o conteúdo na parte seca da tela;
  // na cena inundada não há parte seca, então ela não levanta nada.
  document.documentElement.style.setProperty('--agua', (s.escura ? 6 : Math.min(s.mar, 44)) + 'vh');
  forcaAlvo = s.forca;
  document.body.classList.toggle('inundado', !!s.escura);

  cena.querySelectorAll('[data-contar]').forEach(el => {
    el.textContent = pct(0, +(el.dataset.dec||0));
    setTimeout(() => contar(el), 380);
  });
  cena.querySelectorAll('svg[data-serie]').forEach(svg => desenharFita(svg, primeira ? 700 : 420));
  cena.querySelectorAll('[data-larg]').forEach((b,k) => {
    if (!anima) { b.style.transition = 'none'; b.style.width = b.dataset.larg + '%'; return; }
    b.style.width = '0';
    setTimeout(() => { b.style.width = b.dataset.larg + '%'; }, 500 + k * 140);
  });

  caps.forEach((c,k) => {
    c.classList.toggle('vivo', k === i);
    c.classList.toggle('visto', k < i);
    if (k === i) c.setAttribute('aria-current', 'step'); else c.removeAttribute('aria-current');
  });
  capNome.style.opacity = 0;
  setTimeout(() => {
    capNome.innerHTML = s.cap + (s.mes === null ? '' : ' <i>· ' + MESL[s.mes] + '</i>');
    capNum.textContent = ('0'+(i+1)).slice(-2);
    capNome.style.opacity = 1;
  }, 200);
  contagem.textContent = `${i+1}/${S.length}`;
  ant.disabled = i === 0; prox.disabled = i === S.length - 1;
  history.replaceState(null, '', '#' + s.id);
}

/* ============================================================== o balão */
const balao = document.createElement('div');
balao.className = 'balao'; balao.setAttribute('role','status');
document.body.appendChild(balao);

trilho.querySelectorAll('svg[data-serie]').forEach(svg => {
  const alvos = svg.querySelector('.alvos'); if (!alvos) return;
  const guia = svg.querySelector('.guia'), gl = svg.querySelector('.guia-l'), gp = svg.querySelector('.guia-p');
  const nome = svg.dataset.serie, suf = svg.dataset.sufixo;
  const desde = +svg.dataset.desde, mau = +svg.dataset.mau;
  const mostrar = a => {
    const i = +a.dataset.i, vx = +a.dataset.x, vy = +a.dataset.y, v = +a.dataset.v;
    gl.setAttribute('x1', vx); gl.setAttribute('x2', vx);
    gp.setAttribute('cx', vx); gp.setAttribute('cy', vy);
    gp.setAttribute('fill', i === mau ? '#E23757' : '#0070D1');
    guia.classList.add('vis');
    const c = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    balao.innerHTML = `<span>${MES[i+desde]} · ${nome}</span><b>${suf==='%'?pct(v)+'%':brl(v)}</b>`;
    balao.classList.toggle('mau', i === mau);
    balao.style.left = (c.left + vx/vb.width*c.width) + 'px';
    balao.style.top = (c.top + vy/vb.height*c.height) + 'px';
    balao.classList.add('vis');
  };
  const sumir = () => { balao.classList.remove('vis'); guia.classList.remove('vis'); };
  alvos.addEventListener('pointerover', e => { if (e.target.dataset.i !== undefined) mostrar(e.target); });
  alvos.addEventListener('pointermove', e => { if (e.target.dataset.i !== undefined) mostrar(e.target); });
  svg.addEventListener('pointerleave', sumir);
});

/* ============================================================ interação */
const proximo = () => entrar(atual + 1), anterior = () => entrar(atual - 1);
prox.addEventListener('click', proximo);
ant.addEventListener('click', anterior);
addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); proximo(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); anterior(); }
  else if (e.key === 'Home') entrar(0);
  else if (e.key === 'End') entrar(S.length - 1);
});
let travado = false;
addEventListener('wheel', e => {
  if (travado || Math.abs(e.deltaY) < 18) return;
  travado = true; setTimeout(() => travado = false, 820);
  e.deltaY > 0 ? proximo() : anterior();
}, { passive: true });
let tx = 0, ty = 0;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? proximo() : anterior();
}, { passive: true });
trilho.addEventListener('click', e => { if (!e.target.closest('a,button,.alvos')) proximo(); });
caps.forEach(c => c.addEventListener('click', () => entrar(+c.dataset.i)));
document.getElementById('ir-capa').addEventListener('click', () => entrar(0));
addEventListener('resize', () => { trilho.style.transition = 'none'; trilho.style.transform = `translate3d(${-atual*100}vw,0,0)`;
  requestAnimationFrame(() => trilho.style.transition = ''); });

const inicial = S.findIndex(s => s.id === location.hash.slice(1));
entrar(inicial >= 0 ? inicial : 0, true);
})();
</script>
